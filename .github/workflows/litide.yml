name: Lint,Test & Deploy
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Lint the code
        run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Test the Code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Build the Code
        run: npm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Deploy the Code
        run: echo "Deploying..."
        
        
