name: Lint,Test & Deploy
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Lint the code
        run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Test the Code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Build the Code
        run: npm run build
      - name: Publish JS filename
        id: publish
        run: find dist -type f -name "*.js" | head -n 1 | xargs -I {} echo "script-file={}" >> $GITHUB_OUTPUT
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-files
      - name: List Artifacts
        run: ls
      - name: Output Filenames
          run: echo "{{ needs.build.outputs.script-file }}"
      - name: Install Dependencies
        run: npm ci
      - name: Deploy the Code
        run: echo "Deploying..."
      
          
          
